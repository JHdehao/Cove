name: Export strings

# 手动触发：从代码里抽出全部界面文案（与编译器生成的 key 完全一致），产物是 xcloc / xliff，供补翻译。
on:
  workflow_dispatch:

jobs:
  export:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Export
        run: |
          set -o pipefail
          xcodebuild -exportLocalizations -project Cove.xcodeproj -localizationPath out -exportLanguage en \
            -skipPackagePluginValidation -skipMacroValidation 2>&1 | tail -20
          find out -name "*.xliff" -o -name "*.xcstrings" | head
      - uses: actions/upload-artifact@v4
        with:
          name: Cove-strings
          path: out/
          retention-days: 7
