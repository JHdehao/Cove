name: App Store screenshots

# 手动触发：模拟器里打开示例会议，按 7 种界面语言各截 iPhone 6.9" 与 iPad 13" 四张（资料库 / 纪要 / 转录 / 对话），作为产物下载。
on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 编译（模拟器）
        run: |
          set -o pipefail
          xcodebuild -project Cove.xcodeproj -scheme Cove -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
            -skipPackagePluginValidation -skipMacroValidation CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tail -20

      - name: 截图
        run: |
          set -euo pipefail
          APP=build/dd/Build/Products/Debug-iphonesimulator/Cove.app
          ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          mkdir -p shots
          pick() { xcrun simctl list devices available -j | jq -r --arg p "$1" '[.devices[][] | select(.name | test($p))] | last | .udid'; }
          for spec in "iphone:iPhone [0-9]+ Pro Max" "ipad:iPad Pro 13"; do
            kind=${spec%%:*}; dev=$(pick "${spec#*:}")
            [ "$dev" != "null" ] && [ -n "$dev" ] || { echo "没有 ${spec#*:} 模拟器"; continue; }
            xcrun simctl boot "$dev" || true
            xcrun simctl bootstatus "$dev" -b
            xcrun simctl status_bar "$dev" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4
            # 首次开机的系统通知（如「Ready for Apple Intelligence」）会挡住标题：先等它消失
            sleep 45
            xcrun simctl ui "$dev" appearance light
            for loc in zh-Hans:zh_CN zh-Hant:zh_TW en:en_US ja:ja_JP ko:ko_KR ru:ru_RU ar:ar_SA; do
              lang=${loc%%:*}; region=${loc#*:}
              # 每种语言重装一次：示例会议按语言生成，资料库里只留这一场
              xcrun simctl uninstall "$dev" "$ID" 2>/dev/null || true
              xcrun simctl install "$dev" "$APP"
              mkdir -p "shots/$lang"
              n=0
              for tab in 纪要 转录 对话; do
                n=$((n+1))
                xcrun simctl terminate "$dev" "$ID" 2>/dev/null || true
                xcrun simctl launch "$dev" "$ID" -AppleLanguages "($lang)" -AppleLocale "$region" -CoveDemo YES -CoveTab "$tab"
                sleep 6
                xcrun simctl io "$dev" screenshot "shots/$lang/${kind}-${n}.png"
              done
              xcrun simctl terminate "$dev" "$ID" 2>/dev/null || true
              xcrun simctl launch "$dev" "$ID" -AppleLanguages "($lang)" -AppleLocale "$region" -CoveDemo NO
              sleep 5
              xcrun simctl io "$dev" screenshot "shots/$lang/${kind}-0.png"
            done
            xcrun simctl shutdown "$dev" || true
          done
          ls -l shots

      - uses: actions/upload-artifact@v4
        with:
          name: Cove-screenshots
          path: shots/
          retention-days: 30
